services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gamestudio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres

volumes:
  postgres_data:
